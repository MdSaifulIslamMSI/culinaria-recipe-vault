# Render Infrastructure as Code (Blueprint)
services:
  # Full-Stack Hardened Stateless Node.js Web Service
  - type: web
    name: culinaria-recipe-vault-server
    env: node
    branch: main
    plan: free
    region: oregon
    buildCommand: npm ci --include=dev && npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 3000
      - key: CORS_ORIGINS
        value: https://culinaria-recipe-vault-server.onrender.com,https://culinaria-recipe-vault.onrender.com,https://mdsaifulislammsi.github.io
