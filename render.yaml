# Render Infrastructure as Code (Blueprint)
services:
  # Full-Stack Hardened Stateless Node.js Web Service
  - type: web
    name: culinaria-recipe-vault-server
    env: node
    plan: free
    region: oregon
    buildCommand: npm ci && npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 3000
